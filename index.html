<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    <title>AR 视觉引擎</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: white; }
      #start-btn { padding: 15px 30px; font-size: 18px; background: #2196F3; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
      #hint-text { margin-top: 20px; font-size: 14px; color: #bbb; }
      #status-dot { position: fixed; top: 10px; right: 10px; width: 10px; height: 10px; background: red; border-radius: 50%; z-index: 1001; }
    </style>
  </head>
  <body>
    <div id="status-dot"></div>

    <div id="ui-layer">
      <h2 style="margin-bottom: 10px;">AR 留声照片</h2>
      <p style="margin-bottom: 30px;">正在准备视觉追踪引擎...</p>
      <button id="start-btn">开启体验</button>
      <p id="hint-text">点击后请将摄像头对准照片</p>
    </div>


    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-anchor" mindar-image-target="targetIndex: 0">
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.querySelector("#start-btn");
      const uiLayer = document.querySelector("#ui-layer");
      const sceneEl = document.querySelector("a-scene");
      const statusDot = document.querySelector("#status-dot");

      let audioContext;
      let sound = null;

      document.oncontextmenu = () => false;


      startBtn.addEventListener('click', () => {
        sound = new Audio("./system_core_v1.dat"); 
        sound.preload = "none";

        sceneEl.systems["mindar-image-system"].start();
        uiLayer.style.display = "none";
        statusDot.style.background = "#00ff00"; // 变绿表示运行中
      });

      const targetEntity = document.querySelector("#target-anchor");

      targetEntity.addEventListener("targetFound", () => {
        console.log("Found");
        if (sound) {
          sound.play().catch(e => console.log("播放失败", e));
        }
      });

      targetEntity.addEventListener("targetLost", () => {
        console.log("Lost");
        if (sound) {
          sound.pause();
        }
      });
    </script>
  </body>
</html>
